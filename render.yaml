services:
  - type: web
    name: ai-task-classifier-backend
    runtime: python
    rootDir: backend-task-ia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DATABASE_URL
        value: sqlite:///./app.db
      # IMPORTANTE: define OPENAI_API_KEY en el dashboard de Render
      # (Service -> Environment) para que /recommend funcione.
      - key: OPENAI_API_KEY
        sync: false
      # Opcional: restringir orígenes CORS (ej. https://tu-app.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false
      # URL pública del frontend para el enlace de recuperación de contraseña.
      # Ejemplo: https://tu-app.vercel.app (defínela en el dashboard de Render).
      - key: APP_URL
        sync: false