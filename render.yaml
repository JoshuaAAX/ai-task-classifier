services:
  - type: web
    name: ai-task-classifier-backend
    runtime: python
    rootDir: backend-task-ia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: OPENAI_API_KEY
        sync: false